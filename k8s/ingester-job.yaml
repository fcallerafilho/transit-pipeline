# Ingester — modeled as a Job for 1b because the 1a binary is a one-shot (one poll,
# one row, exit 0). A Deployment would restart-loop it; a Job runs it to completion.
# Step 2's ticker is what turns this into a long-running Deployment.
#
# The initContainer waits for the DB to accept connections — the k8s equivalent of
# docker-compose's `depends_on: service_healthy`.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingester
  namespace: transit
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: ingester
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: timescale/timescaledb:2.29.2-pg17   # reuse the image already on the node for pg_isready
          command:
            - sh
            - -c
            - "until pg_isready -h timescaledb -p 5432 -U transit; do echo 'waiting for db'; sleep 2; done"
      containers:
        - name: ingester
          image: transit-ingester:dev
          imagePullPolicy: IfNotPresent   # use the image loaded via `k3d image import`, never pull
          env:
            - name: SPTRANS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sptrans-token
                  key: SPTRANS_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"           # DESIGN §6.2 budget: ingester ~128 MB
