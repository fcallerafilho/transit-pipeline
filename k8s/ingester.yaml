# Ingester — now a long-running Deployment (step 2). It polls the configured lines on
# a 45 s ticker and continuously COPYs positions into Timescale. Replaces the 1a/1b
# one-shot Job. The wait-for-db initContainer is the k8s equivalent of compose's
# depends_on: service_healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingester
  namespace: transit
  labels:
    app: ingester
spec:
  replicas: 1
  strategy:
    type: Recreate                    # single writer — never run two ingesters at once
  selector:
    matchLabels:
      app: ingester
  template:
    metadata:
      labels:
        app: ingester
    spec:
      # The images live in a private GHCR repo, so the node needs a pull
      # credential. Created out-of-band by `make secrets` (DESIGN §4.8) — it is
      # never in the repo and never baked into an image.
      imagePullSecrets:
        - name: ghcr
      initContainers:
        - name: wait-for-db
          image: timescale/timescaledb:2.29.2-pg17
          command:
            - sh
            - -c
            - "until pg_isready -h timescaledb -p 5432 -U transit; do echo 'waiting for db'; sleep 2; done"
      containers:
        - name: ingester
          image: ghcr.io/fcallerafilho/transit-ingester:v0.1.0-beta
          imagePullPolicy: IfNotPresent   # immutable release tag — see readapi.yaml
          env:
            - name: SPTRANS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sptrans-token
                  key: SPTRANS_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
            - name: LINE_CODES
              value: "402,33361,32975,871,1095"   # the five tracked lines (§11 interim selection)
            - name: POLL_INTERVAL
              value: "45s"                         # measured source cadence (§4.5)
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"                      # DESIGN §6.2 budget: ingester ~128 MB
