# Read API — serves latest positions as JSON to the map. A long-running Deployment
# (unlike the one-shot ingester Job). Reuses the db-credentials secret for its DSN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readapi
  namespace: transit
  labels:
    app: readapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readapi
  template:
    metadata:
      labels:
        app: readapi
    spec:
      # The images live in a private GHCR repo, so the node needs a pull
      # credential. Created out-of-band by `make secrets` (DESIGN §4.8) — it is
      # never in the repo and never baked into an image.
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: readapi
          image: ghcr.io/fcallerafilho/transit-readapi:v0.1.0-beta
          # The tag is an immutable release tag, so "if not present" can never
          # serve a stale build: a new build gets a new tag. This is also what
          # lets the same manifest work on k3d, where the image is side-loaded
          # with `k3d image import` and no pull happens at all.
          imagePullPolicy: IfNotPresent
          env:
            - name: CORS_ALLOW_ORIGIN
              # Every origin the map is ever served from: the custom domain, the
              # canonical Pages URL it is aliased from (kept as a working fallback
              # if the custom domain is ever misconfigured), and `make map` locally.
              # Naming them explicitly keeps this manifest identical everywhere
              # (DESIGN §6) without falling back to "*". Per-deployment preview
              # URLs are deliberately NOT listed — they are not public entry points.
              value: "https://map.callera.com.br,https://transit-map.pages.dev,http://localhost:8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"           # DESIGN §6.2 budget: Read API ~128 MB
---
apiVersion: v1
kind: Service
metadata:
  name: readapi
  namespace: transit
spec:
  selector:
    app: readapi
  ports:
    - port: 8080
      targetPort: 8080
