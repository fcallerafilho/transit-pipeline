# Read API — serves latest positions as JSON to the map. A long-running Deployment
# (unlike the one-shot ingester Job). Reuses the db-credentials secret for its DSN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readapi
  namespace: transit
  labels:
    app: readapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readapi
  template:
    metadata:
      labels:
        app: readapi
    spec:
      containers:
        - name: readapi
          image: transit-readapi:dev
          imagePullPolicy: IfNotPresent   # use the image loaded via `k3d image import`, never pull
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"           # DESIGN §6.2 budget: Read API ~128 MB
---
apiVersion: v1
kind: Service
metadata:
  name: readapi
  namespace: transit
spec:
  selector:
    app: readapi
  ports:
    - port: 8080
      targetPort: 8080
